spring:
  application:
    name: venn-take-home
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

velocity:
  limits:
    daily-amount: 5000
    weekly-amount: 20000
    daily-count: 3
