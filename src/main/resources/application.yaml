spring:
  application:
    name: venn-take-home
  datasource:
    # Local defaults. SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD override them when set.
    url: jdbc:h2:mem:venn;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=5000
    username: user
    password: password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

velocity:
  rules:
    - name: DAILY_COUNT_LIMIT
      window: DAY
      metric: COUNT
      max: 3
    - name: DAILY_AMOUNT_LIMIT
      window: DAY
      metric: AMOUNT
      max-in-cents: 500000    # $5,000.00
    - name: WEEKLY_AMOUNT_LIMIT
      window: WEEK
      metric: AMOUNT
      max-in-cents: 2000000   # $20,000.00
