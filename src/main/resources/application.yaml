spring:
  application:
    name: venn-take-home
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

velocity:
  rules:
    - name: DAILY_COUNT_EXCEEDED
      window: DAY
      metric: COUNT
      max: 3
    - name: DAILY_AMOUNT_EXCEEDED
      window: DAY
      metric: AMOUNT
      max: 5000
    - name: WEEKLY_AMOUNT_EXCEEDED
      window: WEEK
      metric: AMOUNT
      max: 20000
